<script type="application/nuojiji-manifest">{"id":"course-schedule-private","name":"课程表","version":"2.0.1","permissions":["ai","calendar.write"],"chrome":"none"}</script>
<style>
:root{--p:#4338ca;--pb:#eef2ff;--bg:#f8fafc;--card:#fff;--txt:#0f172a;--sub:#64748b;--line:#e2e8f0;--safe:var(--nuo-safe-bottom,20px)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font:14px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:var(--bg);color:var(--txt)}button,input,textarea,select{font:inherit}button{min-height:44px;border:0;border-radius:10px;padding:8px 12px;background:#fff;color:var(--txt);font-weight:600}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff;font-size:16px;color:var(--txt)}textarea{resize:vertical}.app{padding:calc(var(--nuo-safe-top,0px) + 42px) 10px calc(var(--safe) + 18px)}.top{position:fixed;z-index:10;top:var(--nuo-safe-top,0px);left:10px;right:96px;height:34px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:17px;font-weight:800}.tools{display:flex;gap:5px}.tools button{min-height:30px;padding:3px 9px;border:1px solid var(--line);font-size:11px}.bar{display:flex;gap:6px;margin-bottom:8px}.bar button{flex:1;border:1px solid var(--line);font-size:12px;padding:4px}.primary{background:var(--p);color:#fff}.tabs{display:flex;background:#e2e8f0;border-radius:9px;padding:3px;margin-bottom:8px}.tabs button{flex:1;min-height:36px;background:transparent;padding:3px;font-size:12px}.tabs .on{background:#fff;color:var(--p);box-shadow:0 1px 3px #0002}.filters{display:flex;gap:5px;overflow:auto;margin-bottom:7px}.chip{white-space:nowrap;border:1px solid var(--line);border-radius:15px;padding:4px 9px;background:#fff;font-size:11px}.chip.on{background:var(--p);border-color:var(--p);color:#fff}.gridwrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px}.grid{display:grid;grid-template-columns:38px repeat(7,minmax(42px,1fr));gap:3px;min-width:335px}.head{text-align:center;font-size:11px;font-weight:700;padding:3px;color:var(--sub)}.head.today{color:var(--p)}.slot{min-height:58px;background:#f8fafc;border-radius:6px;text-align:center;display:flex;flex-direction:column;justify-content:center;font-size:10px;color:var(--sub)}.slot small{font-size:8px;color:#94a3b8}.cell{min-height:58px;border-radius:7px;padding:4px 3px;font-size:9px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;border:1px solid #dbeafe;background:#f0f4ff;color:#1e3a8a}.cell.empty{background:transparent;border:1px dashed var(--line)}.cell.dim{opacity:.18}.cell b{font-size:9px;line-height:1.2}.cell small{opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.agenda{display:flex;flex-direction:column;gap:7px}.course{background:#fff;border:1px solid var(--line);border-left:4px solid var(--p);border-radius:10px;padding:10px 12px}.course .meta{display:flex;justify-content:space-between;color:var(--sub);font-size:11px}.course strong{display:block;font-size:15px;margin:3px 0}.course small{color:var(--sub)}.emptybox{text-align:center;padding:45px 10px;background:#fff;border:1px dashed var(--line);border-radius:12px;color:var(--sub)}.live{display:none;background:#fffbeb;border:1px solid #fde68a;border-radius:9px;padding:8px 10px;margin-bottom:8px;font-size:11px}.drawer{position:fixed;inset:0;background:#0f172a66;z-index:30;display:none;align-items:flex-end}.drawer.show{display:flex}.box{background:#fff;width:100%;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:15px 13px calc(var(--safe) + 14px)}.boxhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.boxhead h3{margin:0;font-size:16px}.row{margin-bottom:10px}.row label{display:block;color:var(--sub);font-size:11px;font-weight:700;margin-bottom:4px}.tw{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions{display:flex;gap:7px;margin-top:10px}.actions>*{flex:1}.hint{background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:9px;color:var(--sub);font-size:11px;margin-bottom:10px}.msg{min-height:18px;color:var(--sub);font-size:11px;margin-top:8px}@media(prefers-color-scheme:dark){:root{--bg:#0f1117;--card:#1c1f27;--txt:#f2f2f7;--sub:#a1a1aa;--line:#30343d;--pb:#242752}.gridwrap,.course,.box,.drawer button,.drawer input,.drawer textarea,.drawer select,.bar button,.chip{background:#1c1f27}.slot{background:#171a21}.cell.empty{background:transparent}.tabs{background:#282c35}.tabs .on{background:#3a3f4b}}
</style></head><body><main class="app"><header class="top"><span class="brand">课程表 <small id="stats" style="font-size:10px;color:var(--sub)">0门·0节</small></span><span class="tools"><button onclick="openBox('settings')">⚙ 设置</button><button onclick="toggleCompact()" id="compactBtn">精简</button></span></header>
<div class="bar"><button onclick="openBox('import')">📥 导入</button><button onclick="openBox('ai')">✨ AI生课表</button><button onclick="editCourse()">➕ 加课</button><button onclick="openBox('plans')">💾 方案</button><button onclick="openBox('calendar')">📅 日历</button></div><div id="live" class="live"></div><div class="tabs"><button id="weekTab" class="on" onclick="view='week';draw()">周视图</button><button id="dayTab" onclick="view='day';draw()">日视图</button></div><div id="filters" class="filters"></div><div id="days" class="filters" style="display:none"></div><section id="content"></section></main>
<div class="drawer" id="import"><div class="box"><div class="boxhead"><h3>导入课表</h3><button onclick="closeBox('import')">✕</button></div><div class="hint">支持 DOCX、TXT、CSV、HTML 或直接粘贴，也可以选择课表截图进行识别。文件内容只在本机读取并按需发送给你配置的 AI，不包含任何内置密钥。</div><div class="row"><label>粘贴课表文本</label><textarea id="raw" rows="6" placeholder="周一 第1节 08:00-08:45 高等数学 A101 张老师"></textarea></div><div class="row"><label>选择截图（可选）</label><input id="pic" type="file" accept=".docx,.txt,.csv,.html,image/*" onchange="handleImportFile(event)"></div><div class="actions"><button class="primary" onclick="parseText()">✨ AI解析文本</button><button onclick="closeBox('import')">取消</button></div><div id="importMsg" class="msg"></div></div></div>
<div class="drawer" id="ai"><div class="box"><div class="boxhead"><h3>AI 生成课表</h3><button onclick="closeBox('ai')">✕</button></div><div class="hint">输入专业、年级和排课偏好，AI 会生成一份可继续编辑的周课表。</div><div class="row"><textarea id="aiPrompt" rows="5" placeholder="例如：计算机专业大二，周一到周五有高数、英语、数据结构，下午安排实验课"></textarea></div><button class="primary" style="width:100%" onclick="generateTable()">生成并替换当前课表</button><div id="aiMsg" class="msg"></div></div></div>
<div class="drawer" id="edit"><div class="box"><div class="boxhead"><h3 id="editTitle">添加课程</h3><button onclick="closeBox('edit')">✕</button></div><input type="hidden" id="eid"><div class="row"><label>课程名称 *</label><input id="ename" placeholder="高等数学"></div><div class="tw"><div class="row"><label>星期</label><select id="eday"><option value="1">周一</option><option value="2">周二</option><option value="3">周三</option><option value="4">周四</option><option value="5">周五</option><option value="6">周六</option><option value="7">周日</option></select></div><div class="row"><label>节次</label><input id="eslot" type="number" min="1" max="20" value="1"></div></div><div class="tw"><div class="row"><label>开始</label><input id="estart" type="time" value="08:00"></div><div class="row"><label>结束</label><input id="eend" type="time" value="08:45"></div></div><div class="tw"><div class="row"><label>地点</label><input id="eloc"></div><div class="row"><label>老师</label><input id="eteacher"></div></div><div class="actions"><button class="primary" onclick="saveCourse()">保存</button><button id="del" onclick="deleteCourse()" style="color:#dc2626">删除</button></div></div></div>
<div class="drawer" id="plans"><div class="box"><div class="boxhead"><h3>多周方案</h3><button onclick="closeBox('plans')">✕</button></div><div class="hint">课程模板按周保存。切换方案不会覆盖其他方案。</div><div class="row"><label>方案名称</label><input id="planName" placeholder="例如：第3周、考试周"></div><div class="actions"><button class="primary" onclick="savePlan()">保存当前方案</button><button onclick="closeBox('plans')">完成</button></div><div id="planList" class="msg"></div></div></div><div class="drawer" id="calendar"><div class="box"><div class="boxhead"><h3>同步到原生日历</h3><button onclick="closeBox('calendar')">✕</button></div><div class="hint">将当前方案按起始周和周数写入 nuo 原生日历。</div><div class="row"><label>周一日期</label><input id="calStart" type="date"></div><div class="row"><label>同步周数</label><input id="calWeeks" type="number" min="1" max="52" value="16"></div><button class="primary" style="width:100%" onclick="syncCalendar()">写入原生日历</button><div id="calMsg" class="msg"></div></div></div><div class="drawer" id="settings"><div class="box"><div class="boxhead"><h3>设置</h3><button onclick="closeBox('settings')">✕</button></div><div class="row"><label>默认视图</label><select id="defaultView" onchange="settings.defaultView=this.value;save()"><option value="week">周视图</option><option value="day">日视图</option></select></div><div class="row"><label>自定义 CSS</label><textarea id="css" rows="7" placeholder="输入 CSS 美化界面" oninput="applyCss(this.value);save()"></textarea></div><div class="actions"><button onclick="clearAll()" style="color:#dc2626">清空全部课程</button><button onclick="closeBox('settings')">完成</button></div></div></div>
<script>
const D=['','一','二','三','四','五','六','日'],times={1:['08:00','08:45'],2:['08:55','09:40'],3:['09:50','10:35'],4:['10:45','11:30'],5:['14:00','14:45'],6:['14:55','15:40'],7:['15:50','16:35'],8:['16:45','17:30'],9:['18:30','19:15'],10:['19:25','20:10']};let courses=[],view='week',day=new Date().getDay()||7,filter='',picData='',compact=false,settings={defaultView:'week',css:''};
const $=id=>document.getElementById(id), api=window.nuo||{};function toast(s){if(api.ui&&api.ui.toast)api.ui.toast(s);else alert(s)}function openBox(id){$(id).classList.add('show');if(id==='settings'){$('defaultView').value=settings.defaultView;$('css').value=settings.css}}function closeBox(id){$(id).classList.remove('show')}function save(){return api.storage&&api.storage.set('state',{courses,settings,compact,plans})}async function boot(){try{const s=api.storage&&await api.storage.get('state');if(s){courses=s.courses||[];settings=s.settings||settings;compact=!!s.compact;plans=s.plans||[];applyCss(settings.css)}}catch(e){}if(settings.defaultView==='day')view='day';$('compactBtn').textContent=compact?'展开':'精简';draw()}function applyCss(v){settings.css=v||'';let x=$('customcss');if(!x){x=document.createElement('style');x.id='customcss';document.head.appendChild(x)}x.textContent=settings.css}function toggleCompact(){compact=!compact;document.querySelector('.bar').style.display=compact?'none':'flex';save();$('compactBtn').textContent=compact?'展开':'精简'}
function norm(c){c.id=c.id||'c-'+Math.random().toString(36).slice(2);c.day=Math.max(1,Math.min(7,+c.day||1));c.slot=Math.max(1,+c.slot||1);c.startTime=fmt(c.startTime)||(times[c.slot]||times[1])[0];c.endTime=fmt(c.endTime)||(times[c.slot]||times[1])[1];return c}function fmt(t){let m=String(t||'').match(/(\d{1,2})[:：](\d{1,2})/);return m?String(m[1]).padStart(2,'0')+':'+String(m[2]).padStart(2,'0'):''}function esc(s){return String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function draw(){courses=courses.map(norm);$('stats').textContent=`${new Set(courses.map(x=>x.name)).size}门·${courses.length}节`;$('weekTab').className=view==='week'?'on':'';$('dayTab').className=view==='day'?'on':'';let subs=[...new Set(courses.map(x=>x.name.split(/[\s\-_/]/)[0]).filter(Boolean))];$('filters').innerHTML='<span class="chip '+(!filter?'on':'')+'" onclick="filter=\'\';draw()">全部科目</span>'+subs.map(s=>`<span class="chip ${filter===s?'on':''}" onclick="filter='${esc(s)}';draw()">${esc(s)}</span>`).join('');$('filters').style.display=view==='week'?'flex':'none';$('days').style.display=view==='day'?'flex':'none';$('days').innerHTML=D.slice(1).map((x,i)=>`<span class="chip ${day===i+1?'on':''}" onclick="day=${i+1};draw()">周${x}</span>`).join('');view==='week'?week():agenda();live();}
function week(){let slots=[...new Set(courses.map(x=>x.slot))].sort((a,b)=>a-b);if(!slots.length)slots=[1,2,3,4];let h='<div class="gridwrap"><div class="grid"><div class="head">节/周</div>'+D.slice(1).map((x,i)=>`<div class="head ${day===i+1?'today':''}">周${x}</div>`).join('');slots.forEach(s=>{let t=times[s]||['',''];h+=`<div class="slot">第${s}节<small>${t[0]}<br>${t[1]}</small></div>`;for(let d=1;d<=7;d++){let c=courses.find(x=>x.day===d&&x.slot===s),ok=!filter||c&&c.name.split(/[\s\-_/]/)[0]===filter;h+=c?`<div class="cell ${ok?'':'dim'}" onclick="editCourse('${c.id}')"><b>${esc(c.name)}</b><small>${esc(c.location||'')}</small></div>`:`<div class="cell empty" onclick="editCourse(null,${d},${s})"></div>`}});$('content').innerHTML=h+'</div></div>'}
function agenda(){let a=courses.filter(x=>x.day===day).sort((x,y)=>x.slot-y.slot);$('content').innerHTML=a.length?'<div class="agenda">'+a.map(c=>`<div class="course" onclick="editCourse('${c.id}')"><div class="meta"><span>第${c.slot}节</span><span>${c.startTime} - ${c.endTime}</span></div><strong>${esc(c.name)}</strong><small>${esc([c.location,c.teacher].filter(Boolean).join(' · '))}</small></div>`).join('')+'</div>':`<div class="emptybox">周${D[day]}没有排课<br><button style="margin-top:10px" onclick="editCourse(null,${day},1)">➕ 添加课程</button></div>`}function live(){let now=new Date(),m=now.getHours()*60+now.getMinutes(),a=courses.filter(c=>c.day===(now.getDay()||7)).sort((x,y)=>x.startTime.localeCompare(y.startTime)),cur=a.find(c=>m>=mins(c.startTime)&&m<=mins(c.endTime)),next=a.find(c=>mins(c.startTime)>m);$('live').style.display='block';$('live').textContent=cur?`● 上课中：${cur.name} · ${cur.startTime}-${cur.endTime}${cur.location?' · '+cur.location:''}`:next?`下一节：${next.name} · ${next.startTime}`:'今日当前无进行中课程'}function mins(x){let p=x.split(':');return +p[0]*60+ +p[1]}
function editCourse(id,d,s){let c=id?courses.find(x=>x.id===id):null;$('editTitle').textContent=c?'编辑课程':'添加课程';$('eid').value=c?.id||'';$('ename').value=c?.name||'';$('eday').value=c?.day||d||day;$('eslot').value=c?.slot||s||1;$('estart').value=c?.startTime||(times[s||1]||times[1])[0];$('eend').value=c?.endTime||(times[s||1]||times[1])[1];$('eloc').value=c?.location||'';$('eteacher').value=c?.teacher||'';$('del').style.display=c?'block':'none';openBox('edit')}async function saveCourse(){let name=$('ename').value.trim();if(!name)return toast('请输入课程名称');let id=$('eid').value||'c-'+Date.now(),c=norm({id,name,day:+$('eday').value,slot:+$('eslot').value,startTime:$('estart').value,endTime:$('eend').value,location:$('eloc').value.trim(),teacher:$('eteacher').value.trim()});courses=courses.filter(x=>x.id!==id&&!(x.day===c.day&&x.slot===c.slot));courses.push(c);await save();closeBox('edit');draw();toast('课程已保存')}async function deleteCourse(){let id=$('eid').value;if(!id)return;courses=courses.filter(x=>x.id!==id);await save();closeBox('edit');draw();toast('课程已删除')}async function clearAll(){if(!confirm('确定清空全部课程？'))return;courses=[];await save();closeBox('settings');draw()}
let plans=[];function savePlan(){let n=$('planName').value.trim();if(!n)return toast('请输入方案名称');plans=plans.filter(p=>p.name!==n);plans.push({name:n,courses:JSON.parse(JSON.stringify(courses))});save();renderPlans();toast('方案已保存')}function renderPlans(){let el=$('planList');if(!el)return;el.innerHTML=plans.length?plans.map((p,i)=>`<div style="display:flex;gap:6px;margin:5px 0"><button style="flex:1" onclick="courses=JSON.parse(JSON.stringify(plans[${i}].courses));save();draw();toast('已载入${esc(p.name)}')">${esc(p.name)}（${p.courses.length}节）</button><button onclick="plans.splice(${i},1);save();renderPlans()">删除</button></div>`).join(''):'暂无方案'}async function syncCalendar(){if(!api.calendar) return $('calMsg').textContent='目标环境未提供 nuo.calendar 接口';let start=$('calStart').value;if(!start)return toast('请选择周一日期');let weeks=Math.max(1,Math.min(52,+$('calWeeks').value||1)),base=new Date(start+'T00:00:00'),count=0;try{for(let w=0;w<weeks;w++)for(const c of courses){let d=new Date(base);d.setDate(base.getDate()+w*7+c.day-1);let date=d.toISOString().slice(0,10),item={date,startTime:c.startTime,endTime:c.endTime,title:c.name,location:c.location||'',source:'课程表'};if(api.calendar.add)await api.calendar.add(item);else if(api.calendar.create)await api.calendar.create(item);else throw Error('目标环境不支持日历写入');count++}$('calMsg').textContent='已写入 '+count+' 条日程'}catch(e){$('calMsg').textContent='写入失败：'+e.message}}async function callAI(instruction,image){let r;if(image&&api.ai&&api.ai.vision)r=await api.ai.vision(instruction,image);else if(api.ai&&api.ai.chat)r=await api.ai.chat([{role:'system',content:instruction},{role:'user',content:image?'请识别这张课表图片并输出 JSON。':'请根据要求输出 JSON。'}]);else if(window.Nuojiji&&Nuojiji.ai)r=await Nuojiji.ai({messages:[{role:'system',content:instruction},{role:'user',content:image?'请识别这张课表图片并输出 JSON。':'请根据要求输出 JSON。'}]});else throw Error('目标环境未提供 nuo.ai.chat，请检查 API 设置');return r&&r.text||''}function extract(raw){let s=String(raw||'').replace(/```json|```/gi,'').trim(),a=s.indexOf('['),b=s.lastIndexOf(']');if(a>=0&&b>a)s=s.slice(a,b+1);try{return JSON.parse(s)}catch(e){return null}}async function parseText(){let text=$('raw').value.trim();if(!text)return toast('请先粘贴课表文本');$('importMsg').textContent='AI 正在解析…';try{let r=await callAI('你是课表解析器。把输入文本转换成纯 JSON 数组。每项字段必须为 name,day(1-7),slot,startTime,endTime,location,teacher。只能输出 JSON，不要解释。输入：'+text);let a=extract(r);if(!a||!a.length)throw Error('未解析出课程');courses=a.filter(x=>x.name).map(norm);await save();closeBox('import');draw();toast('已导入 '+courses.length+' 节课程')}catch(e){$('importMsg').textContent='解析失败：'+e.message}}async function generateTable(){let p=$('aiPrompt').value.trim();if(!p)return toast('请先输入要求');$('aiMsg').textContent='AI 正在生成…';try{let r=await callAI('你是大学课表规划器。根据需求生成周一至周日课程，输出纯 JSON 数组，每项字段为 name,day(1-7),slot,startTime,endTime,location,teacher，不要解释。需求：'+p);let a=extract(r);if(!a||!a.length)throw Error('未生成有效课表');courses=a.filter(x=>x.name).map(norm);await save();closeBox('ai');draw();toast('已生成 '+courses.length+' 节课程')}catch(e){$('aiMsg').textContent='生成失败：'+e.message}}async function handleImportFile(ev){let f=ev.target.files[0];if(!f)return;let n=f.name.toLowerCase();if(n.endsWith('.docx')){toast('DOCX 已选中，正在读取文本…');try{let buf=await f.arrayBuffer();let zip=await unzipDocx(buf);$('raw').value=docxToText(zip);toast('DOCX 已读取，请点击“AI解析文本”')}catch(e){toast('DOCX 读取失败：'+e.message)}}else if(f.type.startsWith('image/')){let fr=new FileReader();fr.onload=async()=>{picData=fr.result;try{$('raw').value=await callAI('请识别课表图片并输出纯 JSON 数组。字段为 name,day,slot,startTime,endTime,location,teacher；看不清的字段留空，不要解释。',picData);toast('截图识别完成，请核对文本后点击 AI解析')}catch(e){toast('截图识别失败：'+e.message)}};fr.readAsDataURL(f)}else{$('raw').value=await f.text();toast('文件已读取，请点击“AI解析文本”')}}async function unzipDocx(buf){if(typeof DecompressionStream==='undefined')throw Error('当前环境不支持 DOCX 解压，请先另存为 TXT/CSV/HTML');let bytes=new Uint8Array(buf),view=new DataView(buf),out=[];for(let i=0;i<bytes.length-3;i++){if(view.getUint32(i,true)!==0x04034b50)continue;let method=view.getUint16(i+8,true),size=view.getUint32(i+18,true),nameLen=view.getUint16(i+26,true),extraLen=view.getUint16(i+28,true),name=new TextDecoder().decode(bytes.slice(i+30,i+30+nameLen)),data=bytes.slice(i+30+nameLen+extraLen,i+30+nameLen+extraLen+size);if(name==='word/document.xml'){if(method!==8)throw Error('DOCX 压缩格式不支持');let ds=new DecompressionStream('deflate-raw'),stream=new Blob([data]).stream().pipeThrough(ds);return {xml:await new Response(stream).text()}}}throw Error('DOCX 中未找到正文')}function docxToText(z){return z.xml.replace(/<w:tab\s*\/?>/g,'\t').replace(/<w:br\s*\/?>/g,'\n').replace(/<\/w:p>/g,'\n').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim()}api.on&&api.on('viewport',()=>{});boot();setInterval(live,60000);
</script></body></html>
