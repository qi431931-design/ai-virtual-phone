<style>

min-width:335px}.head{text-align:center;font-size:11px;font-weight:700;padding:3px;color:var(--sub)}.head.today{color:var(--p)}.slot{min-height:58px;background:#f8fafc;border-radius:6px;text-align:center;display:flex;flex-direction:column;justify-content:center;font-size:10px;color:var(--sub)}.slot small{font-size:8px;color:#94a3b8}.cell{min-height:58px;border-radius:7px;padding:4px 3px;font-size:9px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;border:1px solid #dbeafe;background:#f0f4ff;color:#1e3a8a}.cell.empty{background:transparent;border:1px dashed var(--line)}.cell.dim{opacity:.18}.cell b{font-size:9px;line-height:1.2}.cell small{opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.agenda{display:flex;flex-direction:column;gap:7px}.course{background:#fff;border:1px solid var(--line);border-left:4px solid var(--p);border-radius:10px;padding:10px 12px}.course .meta{display:flex;justify-content:space-between;color:var(--sub);font-size:11px}.course strong{display:block;font-size:15px;margin:3px 0}.course small{color:var(--sub)}.emptybox{text-align:center;padding:45px 10px;background:#fff;border:1px dashed var(--line);border-radius:12px;color:var(--sub)}.live{display:none;background:#fffbeb;border:1px solid #fde68a;border-radius:9px;padding:8px 10px;margin-bottom:8px;font-size:11px}.drawer{position:fixed;inset:0;background:#0f172a66;z-index:30;display:none;align-items:flex-end}.drawer.show{display:flex}.box{background:#fff;width:100%;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:15px 13px calc(var(--safe) + 14px)}.boxhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.boxhead h3{margin:0;font-size:16px}.row{margin-bottom:10px}.row label{display:block;color:var(--sub);font-size:11px;font-weight:700;margin-bottom:4px}.tw{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions{display:flex;gap:7px;margin-top:10px}.actions>*{flex:1}.hint{background:#f8fafc;b </style></head><body><main class="app"><header class="top"><span class="brand">课程表 <small id="stats" style="font-size:10px;color:var(--sub)">0门·0节</small></span><span class="tools"><button type="button" onclick="openBox('settings')">⚙ 设置</button><button type="button" onclick="toggleCompact()" id="compactBtn">精简</button></span></header>
<div class="bar"><button onclick="openBox('import')">📥 导入</button><button onclick="editCourse()">➕ 加课</button><button onclick="openBox('plans')">💾 方案</button><button onclick="openBox('calendar')">📅 日历</button></div><div id="live" class="live"></div><div class="tabs"><button id="weekTab" class="on" onclick="view='week';draw()">周视图</button><button id="dayTab" onclick="view='day';draw()">日视图</button></div><div id="filters" class="filters"></div><div id="days" class="filters" style="display:none"></div><section id="content"></section></main>
<div class="drawer" id="import"><div class="box"><div class="boxhead"><h3>导入课表</h3><button onclick="closeBox('import')">✕</button></div><div class="hint">支持 DOCX、TXT、CSV、HTML 或直接粘贴，也可以选择课表截图进行识别。文件内容只在本机读取并按需发送给你配置的 AI，不包含任何内置密钥。</div><div class="row"><label>粘贴课表文本</label><textarea id="raw" rows="6" placeholder="周一 第1节 08:00-08:45 高等数学 A101 张老师"></textarea></div><div class="row"><label>选择截图（可选）</label><input id="pic" type="file" accept="image/*,.txt,.csv,.html" onchange="handleImportFile(event)"></div><div class="actions"><button class="primary" onclick="parseText()">✨ AI解析文本</button><button class="primary" onclick="generateTable()">✨ AI生成课表</button><button onclick="closeBox('import')">取消</button></div><div id="importMsg" class="msg"></div></div></div>
<div class="drawer" id="ai"><div class="box"><div class="boxhead"><h3>AI 生成课表</h3><button onclick="closeBox('ai')">✕</button></div><div class="hint">输入专业、年级和排课偏好，AI 会生成一份可继续编辑的周课表。</div><div class="row"><textarea id="aiPrompt" rows="5" placeholder="例如：计算机专业大二，周一到周五有高数、英语、数据结构，下午安排实验课"></textarea></div><button class="primary" style="width:100%" onclick="generateTable()">生成并替换当前课表</button><div id="aiMsg" class="msg"></div></div></div>
<div class="drawer" id="edit"><div class="box"><div class="boxhead"><h3 id="editTitle">添加课程</h3><button onclick="closeBox('edit')">✕</button></div><input type="hidden" id="eid"><div class="row"><label>课程名称 *</label><input id="ename" placeholder="高等数学"></div><div class="tw"><div class="row"><label>星期</label><select id="eday"><option value="1">周一</option><option value="2">周二</option><option value="3">周三</option><option value="4">周四</option><option value="5">周五</option><option value="6">周六</option><option value="7">周日</option></select></div><div class="row"><label>节次</label><input id="eslot" type="number" min="1" max="20" value="1"></div></div><div class="tw"><div class="row"><label>开始</label><input id="estart" type="time" value="08:00"></div><div class="row"><label>结束</label><input id="eend" type="time" value="08:45"></div></div><div class="tw"><div class="row"><label>地点</label><input id="eloc"></div><div class="row"><label>老师</label><input id="eteacher"></div></div><div class="actions"><button class="primary" onclick="saveCourse()">保存</button><button id="del" onclick="deleteCourse()" style="color:#dc2626">删除</button></div></div></div>
<div class="drawer" id="plans"><div class="box"><div class="boxhead"><h3>多周方案</h3><button onclick="closeBox('plans')">✕</button></div><div class="hint">课程模板按周保存。切换方案不会覆盖其他方案。</div><div class="row"><label>方案名称</label><input id="planName" placeholder="例如：第3周、考试周"></div><div class="actions"><button class="primary" onclick="savePlan()">保存当前方案</button><button onclick="closeBox('plans')">完成</button></div><div id="planList" class="msg"></div></div></div><div class="drawer" id="calendar"><div class="box"><div class="boxhead"><h3>同步到原生日历</h3><button onclick="closeBox('calendar')">✕</button></div><div class="hint">将当前方案按起始周和周数写入 nuo 原生日历。</div><div class="row"><label>周一日期</label><input id="calStart" type="date" onchange="if(!this.value){let d=new Date();d.setDate(d.getDate()-(d.getDay()||7)+1);this.value=d.toISOString().slice(0,10)}"></div><div class="row"><label>同步周数</label><input id="calWeeks" type="number" min="1" max="52" value="16"></div><button class="primary" style="width:100%" onclick="syncCalendar()">写入原生日历</button><div id="calMsg" class="msg"></div></div></div><div class="drawer" id="settings"><div class="box"><div class="boxhead"><h3>设置</h3><button onclick="closeBox('settings')">✕</button></div><div class="row"><label>默认视图</label><select id="defaultView" onchange="settings.defaultView=this.value;save()"><option value="week">周视图</option><option value="day">日视图</option></select></div><div class="row"><label>自定义 CSS</label><textarea id="css" rows="7" placeholder="输入 CSS 美化界面" oninput="applyCss(this.value);save()"></textarea><button type="button" style="margin-top:6px;width:100%" onclick="insertPresetCss()">✨ 填入默认美化示例</button></div><div class="row"><label>当前分享角色</label><select id="shareCharSelect"><option>正在读取角色…</option></select><button type="button" style="width:100%;margin-top:6px" onclick="shareCard()">📤 分享课表卡片</button></div><div class="row"><label><input id="highlightCurrent" type="checkbox" checked onchange="settings.highlightCurrent=this.checked;save();draw()" style="width:auto;margin-right:6px">实时高亮当前课程（上课中 / 进行中）</label></div><div class="hint">功能导览：支持周视图、日视图、手动加课、DOC/DOCX/文本/截图导入、AI 解析、AI 生课表、多周方案、日历同步、角色记忆与供稿。</div><div class="actions"><button onclick="clearAll()" style="color:#dc2626">清空当前方案排课数据</button><button onclick="closeBox('settings')">完成</button></div></div></div>
<script>
const D=['','一','二','三','四','五','六','日'],times={1:['08:00','08:45'],2:['08:55','09:40'],3:['09:50','10:35'],4:['10:45','11:30'],5:['14:00','14:45'],6:['14:55','15:40'],7:['15:50','16:35'],8:['16:45','17:30'],9:['18:30','19:15'],10:['19:25','20:10']};let courses=[],view='week',day=new Date().getDay()||7,filter='',picData='',compact=false,settings={defaultView:'week',css:''};
const PRESET_CSS=':root{--p:#4f46e5;--bg:#f5f7fb}.gridwrap{border-radius:14px;box-shadow:0 4px 16px #1e293b12}.cell{border-radius:10px}.course{border-radius:14px;box-shadow:0 3px 12px #1e293b12}';const $=id=>document.getElementById(id), api=window.nuo||{};function insertPresetCss(){$('css').value=PRESET_CSS;applyCss(PRESET_CSS);save();toast('已填入默认美化示例')}function adjustTopSpacing(){let top=getComputedStyle(document.documentElement).getPropertyValue('--nuo-safe-top').trim();let n=parseFloat(top)||0;document.querySelector('.app').style.paddingTop=Math.max(132,n+110)+'px';let t=document.querySelector('.top');if(t){t.style.top=Math.max(24,n+24)+'px';t.style.height='48px'}}async function publishSchedule(){if(!api.feed||!api.feed.publish)return toast('当前环境未启用角色供稿');if(!api.feed||!api.feed.publish)return toast('目标环境未提供 nuo.feed.publish');let items=courses.slice(0,20).map(c=>({id:c.id,title:c.name,desc:`周${D[c.day]} ${c.startTime}-${c.endTime}${c.location?' @'+c.location:''}`}));try{await api.feed.publish({summary:`我的每周课程表，共${courses.length}节课。`,guide:'角色需要判断用户是否有课、何时方便时参考；不要频繁主动提及。',items});toast('已把课程表发布给角色')}catch(e){toast('发布失败：'+(e.message||e))}}async function openMemoryBox(){return shareCard();}function openMemoryBox_legacy(){try{if(!api.roster||!api.roster.list||!api.roster.profile)throw Error('目标环境未提供角色名册接口');let chars=await api.roster.list(),list=Array.isArray(chars)?chars:(chars&&chars.characters)||[];if(!list.length)return toast('角色名册为空');let names=list.map((c,i)=>`${i+1}. ${c.name||c.charName||c.id}`).join('\n');let pick=prompt('选择发卡片的角色编号：\n'+names,'1'),idx=Math.max(0,Number(pick)-1),c=list[idx];if(!c)return;let cp=await api.roster.profile(c.id),text=generateMemoryText(null,cp);if(!api.chat||!api.chat.sendCard)throw Error('目标环境未提供 nuo.chat.sendCard');await api.chat.sendCard({title:'课程表长期记录',summary:text,fields:[{label:'角色',value:cp?.name||c.name||'角色'},{label:'课程数量',value:String(courses.length)}],badge:'课程表'});toast('已将课程表卡片发送到聊天')}catch(e){toast('发送课程表卡片失败：'+(e&&e.message||e))}}async function loadShareChars(){try{let r=await api.roster.list(),a=Array.isArray(r)?r:(r&&r.characters)||[],s=$('shareCharSelect');if(s)s.innerHTML=a.map(c=>`<option value="${esc(c.id)}">${esc(c.name||c.charName||c.id)}</option>`).join('')||'<option>没有角色</option>'}catch(e){}}async function shareCard(){let id=$('shareCharSelect')?.value;if(!id||!api.chat||!api.chat.sendCard)return toast('无法发送：请检查角色名册与聊天卡片权限');try{let c=await api.roster.profile(id);await api.chat.sendCard({characterId:id,title:'课程表',summary:generateMemoryText(null,c),fields:[{label:'课程数量',value:String(courses.length)}],badge:'课程表'});toast('课程表卡片已发送')}catch(e){toast('卡片发送失败：'+(e.message||e))}}function generateMemoryText(user,char){let lines=['用户的每周课程安排：'];for(let d=1;d<=7;d++){let a=courses.filter(c=>+c.day===d).sort((x,y)=>x.slot-y.slot);lines.push('周'+D[d]+'：'+(a.length?a.map(c=>`${c.startTime}-${c.endTime} ${c.name}${c.location?'（'+c.location+'）':''}`).join('；'):'无课'))}return lines.join('\n')}function toast(s){if(api.ui&&api.ui.toast)api.ui.toast(s);else alert(s)}function openBox(id){$(id).classList.add('show');if(id==='settings'){$('defaultView').value=settings.defaultView;$('css').value=settings.css}if(id==='import'){$('aiPrompt').value=''}}function closeBox(id){$(id).classList.remove('show')}function save(){return api.storage&&api.storage.set('state',{courses,settings,compact,plans})}async function boot(){try{const s=api.storage&&await api.storage.get('state');if(s){courses=s.courses||[];settings=s.settings||settings;compact=!!s.compact;plans=s.plans||[];applyCss(settings.css)}}catch(e){}if(settings.defaultView==='day')view='day';if(settings.highlightCurrent===undefined)settings.highlightCurrent=true;applyCompact();renderPlans();adjustTopSpacing();loadShareChars();draw()}function applyCss(v){settings.css=v||'';let x=$('customcss');if(!x){x=document.createElement('style');x.id='customcss';document.head.appendChild(x)}x.textContent=settings.css}function applyCompact(){let b=document.querySelector('.bar');if(b)b.style.display=compact?'none':'flex';let btn=$('compactBtn');if(btn)btn.textContent=compact?'展开':'精简'}function toggleCompact(){compact=!compact;applyCompact();save();toast(compact?'已精简工具栏':'已展开工具栏')}
function norm(c){c.id=c.id||'c-'+Math.random().toString(36).slice(2);c.day=Math.max(1,Math.min(7,+c.day||1));c.slot=Math.max(1,+c.slot||1);c.startTime=fmt(c.startTime)||(times[c.slot]||times[1])[0];c.endTime=fmt(c.endTime)||(times[c.slot]||times[1])[1];return c}function fmt(t){let m=String(t||'').match(/(\d{1,2})[:：](\d{1,2})/);return m?String(m[1]).padStart(2,'0')+':'+String(m[2]).padStart(2,'0'):''}function esc(s){return String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function draw(){courses=courses.map(norm);$('stats').textContent=`${new Set(courses.map(x=>x.name)).size}门·${courses.length}节`;$('weekTab').className=view==='week'?'on':'';$('dayTab').className=view==='day'?'on':'';let subs=[...new Set(courses.map(x=>x.name.split(/[\s\-_/]/)[0]).filter(Boolean))];$('filters').innerHTML='<span class="chip '+(!filter?'on':'')+'" onclick="filter=\'\';draw()">全部科目</span>'+subs.map(s=>`<span class="chip ${filter===s?'on':''}" onclick="filter='${esc(s)}';draw()">${esc(s)}</span>`).join('');$('filters').style.display=view==='week'?'flex':'none';$('days').style.display=view==='day'?'flex':'none';$('days').innerHTML=D.slice(1).map((x,i)=>`<span class="chip ${day===i+1?'on':''}" onclick="day=${i+1};draw()">周${x}</span>`).join('');view==='week'?week():agenda();live();}
function week(){let slots=[...new Set(courses.map(x=>x.slot))].sort((a,b)=>a-b);if(!slots.length)slots=[1,2,3,4];let h='<div class="gridwrap"><div class="grid"><div class="head">节/周</div>'+D.slice(1).map((x,i)=>`<div class="head ${day===i+1?'today':''}">周${x}</div>`).join('');slots.forEach(s=>{let t=times[s]||['',''];h+=`<div class="slot">第${s}节<small>${t[0]}<br>${t[1]}</small></div>`;for(let d=1;d<=7;d++){let c=courses.find(x=>x.day===d&&x.slot===s),ok=!filter||c&&c.name.split(/[\s\-_/]/)[0]===filter;h+=c?`<div class="cell ${ok?'':'dim'} ${isCurrent(c)?'current':''}" onclick="editCourse('${c.id}')"><b>${esc(c.name)}</b><small>${esc(c.location||'')}</small></div>`:`<div class="cell empty" onclick="editCourse(null,${d},${s})"></div>`}});$('content').innerHTML=h+'</div></div>'}
function agenda(){let a=courses.filter(x=>x.day===day).sort((x,y)=>x.slot-y.slot);$('content').innerHTML=a.length?'<div class="agenda">'+a.map(c=>`<div class="course" onclick="editCourse('${c.id}')"><div class="meta"><span>第${c.slot}节</span><span>${c.startTime} - ${c.endTime}</span></div><strong>${esc(c.name)}</strong><small>${esc([c.location,c.teacher].filter(Boolean).join(' · '))}</small></div>`).join('')+'</div>':`<div class="emptybox">周${D[day]}没有排课<br><button style="margin-top:10px" onclick="editCourse(null,${day},1)">➕ 添加课程</button></div>`}function isCurrent(c){if(settings.highlightCurrent===false)return false;let n=new Date(),d=n.getDay()||7;if(+c.day!==d)return false;let m=n.getHours()*60+n.getMinutes();return m>=mins(c.startTime)&&m<=mins(c.endTime)}function live(){let now=new Date(),m=now.getHours()*60+now.getMinutes(),a=courses.filter(c=>c.day===(now.getDay()||7)).sort((x,y)=>x.startTime.localeCompare(y.startTime)),cur=a.find(c=>m>=mins(c.startTime)&&m<=mins(c.endTime)),next=a.find(c=>mins(c.startTime)>m);$('live').style.display='block';$('live').textContent=cur?`● 上课中：${cur.name} · ${cur.startTime}-${cur.endTime}${cur.location?' · '+cur.location:''}`:next?`下一节：${next.name} · ${next.startTime}`:'今日当前无进行中课程'}function mins(x){let p=x.split(':');return +p[0]*60+ +p[1]}
function editCourse(id,d,s){let c=id?courses.find(x=>x.id===id):null;$('editTitle').textContent=c?'编辑课程':'添加课程';$('eid').value=c?.id||'';$('ename').value=c?.name||'';$('eday').value=c?.day||d||day;$('eslot').value=c?.slot||s||1;$('estart').value=c?.startTime||(times[s||1]||times[1])[0];$('eend').value=c?.endTime||(times[s||1]||times[1])[1];$('eloc').value=c?.location||'';$('eteacher').value=c?.teacher||'';$('del').style.display=c?'block':'none';openBox('edit')}async function saveCourse(){let name=$('ename').value.trim();if(!name)return toast('请输入课程名称');let id=$('eid').value||'c-'+Date.now(),c=norm({id,name,day:+$('eday').value,slot:+$('eslot').value,startTime:$('estart').value,endTime:$('eend').value,location:$('eloc').value.trim(),teacher:$('eteacher').value.trim()});courses=courses.filter(x=>x.id!==id&&!(x.day===c.day&&x.slot===c.slot));courses.push(c);await save();closeBox('edit');draw();toast('课程已保存')}async function deleteCourse(){let id=$('eid').value;if(!id)return;courses=courses.filter(x=>x.id!==id);await save();closeBox('edit');draw();toast('课程已删除')}async function clearAll(){if(!confirm('确定清空全部课程？'))return;courses=[];await save();closeBox('settings');draw()}
let plans=[];function renderPlans(){let el=$('planList');if(!el)return;el.innerHTML=plans.length?plans.map((p,i)=>`<div style="display:flex;gap:6px;margin:5px 0"><button style="flex:1" type="button" onclick="courses=JSON.parse(JSON.stringify(plans[${i}].courses));save();draw();toast('已载入${esc(p.name)}')">${esc(p.name)}（${p.courses.length}节）</button><button type="button" onclick="plans.splice(${i},1);save();renderPlans()">删除</button></div>`).join(''):'暂无方案'}function savePlan(){let n=$('planName').value.trim();if(!n)return toast('请输入方案名称');plans=plans.filter(p=>p.name!==n);plans.push({name:n,courses:JSON.parse(JSON.stringify(courses))});save();renderPlans();toast('方案已保存')}async function syncCalendar(){if(!api.calendar||!api.calendar.add)return $('calMsg').textContent='目标环境未提供 nuo.calendar.add，请确认已授权“新增日历事件”';let start=$('calStart').value;if(!start)return toast('请选择周一日期');let weeks=Math.max(1,Math.min(52,+$('calWeeks').value||1)),base=new Date(start+'T00:00:00'),count=0;try{for(let w=0;w<weeks;w++)for(const c of courses){let d=new Date(base);d.setDate(base.getDate()+w*7+c.day-1);let date=d.toISOString().slice(0,10),item={date,startTime:c.startTime,endTime:c.endTime,title:c.name,location:c.location||'',source:'课程表'};if(api.calendar.add)await api.calendar.add(item);else if(api.calendar.create)await api.calendar.create(item);else if(api.calendar.write)await api.calendar.write({operation:'add',...item});else throw Error('目标环境不支持日历写入');count++}$('calMsg').textContent='已写入 '+count+' 条日程'}catch(e){$('calMsg').textContent='写入失败：'+(e&&e.message||e)}}async function callAI(instruction,image){let r;if(image&&api.ai&&api.ai.vision)r=await api.ai.vision(instruction,image);else if(api.ai&&api.ai.chat)r=await api.ai.chat([{role:'system',content:instruction},{role:'user',content:image?'请识别这张课表图片并输出 JSON。':'请根据要求输出 JSON。'}]);else if(window.Nuojiji&&Nuojiji.ai)r=await Nuojiji.ai({messages:[{role:'system',content:instruction},{role:'user',content:image?'请识别这张课表图片并输出 JSON。':'请根据要求输出 JSON。'}]});else throw Error('目标环境未提供 nuo.ai.chat，请检查 API 设置');return r&&r.text||''}function extract(raw){let s=String(raw||'').replace(/```json|```/gi,'').trim(),a=s.indexOf('['),b=s.lastIndexOf(']');if(a>=0&&b>a)s=s.slice(a,b+1);try{return JSON.parse(s)}catch(e){return null}}async function parseText(){let text=$('raw').value.trim();if(!text)return toast('请先粘贴课表文本');$('importMsg').textContent='AI 正在解析…';try{let r=await callAI('你是课表解析器。把输入文本转换成纯 JSON 数组。每项字段必须为 name,day(1-7),slot,startTime,endTime,location,teacher。只能输出 JSON，不要解释。输入：'+text);let a=extract(r);if(!a||!a.length)throw Error('未解析出课程');courses=a.filter(x=>x.name).map(norm);await save();closeBox('import');draw();toast('已导入 '+courses.length+' 节课程')}catch(e){$('importMsg').textContent='解析失败：'+e.message}}async function generateTable(){let p=$('aiPrompt').value.trim();if(!p)return toast('请先输入要求');$('aiMsg').textContent='AI 正在生成…';try{let r=await callAI('你是大学课表规划器。根据需求生成周一至周日课程，输出纯 JSON 数组，每项字段为 name,day(1-7),slot,startTime,endTime,location,teacher，不要解释。需求：'+p);let a=extract(r);if(!a||!a.length)throw Error('未生成有效课表');courses=a.filter(x=>x.name).map(norm);await save();closeBox('ai');draw();toast('已生成 '+courses.length+' 节课程')}catch(e){$('aiMsg').textContent='生成失败：'+e.message}}async function handleImportFile(ev){let f=ev.target.files[0];if(!f)return;let n=f.name.toLowerCase();if(n.endsWith('.docx')){toast('DOCX 已选中，正在读取文本…');try{let buf=await f.arrayBuffer();let zip=await unzipDocx(buf);$('raw').value=docxToText(zip);toast('DOCX 已读取，请点击“AI解析文本”')}catch(e){toast('DOCX 读取失败：'+e.message)}}else if(n.endsWith('.doc')){try{let buf=await f.arrayBuffer();let text=legacyDocToText(buf);if(!text)throw Error('旧版 DOC 是二进制格式，未提取到可读文字；请用 Word/WPS 另存为 DOCX、TXT 或 HTML');$('raw').value=text;toast('DOC 已提取可读文字，请点击“AI解析文本”')}catch(e){toast('DOC 读取失败：'+e.message)}}else if(f.type.startsWith('image/')){let fr=new FileReader();fr.onload=async()=>{picData=fr.result;try{$('raw').value=await callAI('请识别课表图片并输出纯 JSON 数组。字段为 name,day,slot,startTime,endTime,location,teacher；看不清的字段留空，不要解释。',picData);toast('截图识别完成，请核对文本后点击 AI解析')}catch(e){toast('截图识别失败：'+e.message)}};fr.readAsDataURL(f)}else{$('raw').value=await f.text();toast('文件已读取，请点击“AI解析文本”')}}async function unzipDocx(buf){if(typeof DecompressionStream==='undefined')throw Error('当前环境不支持 DOCX 解压，请先另存为 TXT/CSV/HTML');let bytes=new Uint8Array(buf),view=new DataView(buf),out=[];for(let i=0;i<bytes.length-3;i++){if(view.getUint32(i,true)!==0x04034b50)continue;let method=view.getUint16(i+8,true),size=view.getUint32(i+18,true),nameLen=view.getUint16(i+26,true),extraLen=view.getUint16(i+28,true),name=new TextDecoder().decode(bytes.slice(i+30,i+30+nameLen)),data=bytes.slice(i+30+nameLen+extraLen,i+30+nameLen+extraLen+size);if(name==='word/document.xml'){if(method!==8)throw Error('DOCX 压缩格式不支持');let ds=new DecompressionStream('deflate-raw'),stream=new Blob([data]).stream().pipeThrough(ds);return {xml:await new Response(stream).text()}}}throw Error('DOCX 中未找到正文')}function legacyDocToText(buf){let b=new Uint8Array(buf),s='';for(let i=0;i<b.length;i++){if(b[i]===0)continue;if(b[i]>=32||b[i]===10||b[i]===13||b[i]===9)s+=String.fromCharCode(b[i])}return s.replace(/[\x00-\x1f]+/g,' ').replace(/\s{2,}/g,' ').trim()}function docxToText(z){return z.xml.replace(/<w:tab\s*\/?>/g,'\t').replace(/<w:br\s*\/?>/g,'\n').replace(/<\/w:p>/g,'\n').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim()}api.on&&api.on('viewport',()=>{adjustTopSpacing()});boot();setInterval(live,60000);
